<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
</head>
<body>
    <h1>Login Page</h1>
    <form method="post">
        {% csrf_token %}
        <input type="text" name="email_value" placeholder="Enter your email">
        <input type="password" name="password_value" placeholder="Enter your password">
        <button type="submit">Login</button>
    </form>
    {% if error %}
        <p style="color: red;">{{ error }}</p> 
    {% endif %}
    <a href="/register/">Register</a>
    <a href="/forgot-password/">forgot-password</a>
</body>
</html>
