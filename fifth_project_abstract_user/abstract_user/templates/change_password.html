<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cahnge Password</title>
</head>
<body>
    <form method="post">
        {% csrf_token %}
        <input type="text" name="old_pass" placeholder="Enter your old password">
        <input type="text" name= "new_pass" placeholder="Enter new password">
        <input type="text" name="confirm_pass" placeholder="Enter confirm password">
        <button type="submit">Change Password</button>
    </form>

    {% if error %}
        <p style="color: red;">{{error}}</p>
    {% endif %}
</body>
</html>
